<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign Up - Trivishna</title>
    <link rel="stylesheet" href="/static/css/auth.css" />
</head>
<body>
    <div class="auth-container">
        <form method="POST" action="/signup/">
            <h2>Sign Up</h2>
            <div class="input-box">
                <input type="text" name="username" id="username" required placeholder=" " />
                <label for="username">Username</label>
            </div>
            <div class="input-box">
                <input type="email" name="email" id="email" required placeholder=" " />
                <label for="email">Email</label>
            </div>
            <div class="input-box">
                <input type="password" name="password1" id="password1" required placeholder=" " />
                <label for="password1">Password</label>
            </div>
            <div class="input-box">
                <input type="password" name="password2" id="password2" required placeholder=" " />
                <label for="password2">Confirm Password</label>
            </div>
            <button type="submit">Sign Up</button>
            <p class="bottom-text">Already have an account? <a href="/login/">Login</a></p>
        </form>
    </div>
</body>
</html>
