{% extends "base.html" %}

{% block content %}
<!-- Single File Login Page with CSS -->
<div class="container">
    <div class="brand-title">TRIVISHNA</div>
    <div class="inputs">
        <form method="POST">
            {% csrf_token %}
            
            <!-- Username Field -->
            <label for="id_username">Username</label>
            {{ form.username }}

            <!-- Password Field -->
            <label for="id_password">Password</label>
            {{ form.password }}

            <!-- Submit Button -->
            <button type="submit">LOGIN</button>
        </form>
    </div>
    
    <!-- Signup Link -->
    <p class="text-sm text-center text-gray-600 mt-4">
        New here?
        <a href="{% url 'signup' %}" class="text-green-600 hover:underline">Create an account</a>
    </p>
    <p class="text-sm text-center mt-4">
      <a href="{% url 'password_reset' %}" class="text-blue-600 hover:underline text-xs">
          Forgot your password?
      </a>
  </p>
</div>

<!-- Inline CSS Styling -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;900&display=swap');

  input {
    caret-color: red;
  }

  body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    background: #ecf0f3;
    display: flex;
    align-items: center;
    text-align: center;
    justify-content: center;
    place-items: center;
    overflow: hidden;
    font-family: poppins;
  }

  .container {
    position: relative;
    width: 350px;
    height: 500px;
    border-radius: 20px;
    padding: 40px;
    box-sizing: border-box;
    background: #ecf0f3;
    box-shadow: 14px 14px 20px #cbced1, -14px -14px 20px white;
  }

  .brand-title {
    margin-top: 10px;
    font-weight: 900;
    font-size: 1.8rem;
    color: #1DA1F2;
    letter-spacing: 1px;
    text-align: center;
  }

  .inputs {
    text-align: left;
    margin-top: 30px;
  }

  label, input, button {
    display: block;
    width: 100%;
    padding: 0;
    border: none;
    outline: none;
    box-sizing: border-box;
  }

  label {
    margin-bottom: 4px;
  }

  label:nth-of-type(2) {
    margin-top: 12px;
  }

  input::placeholder {
    color: gray;
  }

  input {
    background: #ecf0f3;
    padding: 10px;
    padding-left: 20px;
    height: 50px;
    font-size: 14px;
    border-radius: 50px;
    box-shadow: inset 6px 6px 6px #cbced1, inset -6px -6px 6px white;
  }

  button {
    color: white;
    margin-top: 20px;
    background: #1DA1F2;
    height: 40px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 900;
    box-shadow: 6px 6px 6px #cbced1, -6px -6px 6px white;
    transition: 0.5s;
  }

  button:hover {
    box-shadow: none;
  }

  a {
    position: absolute;
    font-size: 8px;
    bottom: 4px;
    right: 4px;
    text-decoration: none;
    color: black;
    background: yellow;
    border-radius: 10px;
    padding: 2px;
  }

  h1 {
    position: absolute;
    top: 0;
    left: 0;
  }
</style>
{% endblock %}
