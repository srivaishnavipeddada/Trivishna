<div class="max-w-2xl mx-auto bg-white shadow-md rounded-xl p-8 mt-10">
    <h2 class="text-2xl font-bold mb-6 text-blue-700 text-center">🗓️ Trip Planner</h2>

    <form method="POST" class="space-y-6">
        {% csrf_token %}

        <div>
            <label for="start_date" class="block text-sm font-semibold text-gray-700 mb-1">Start Date:</label>
            <input type="date" name="start_date" value="{{ start_date|date:'Y-m-d' }}" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label for="duration" class="block text-sm font-semibold text-gray-700 mb-1">Duration (Days):</label>
            <input type="number" name="duration" value="{{ duration }}" required min="1"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="text-center">
            <button type="submit"
                    class="bg-blue-600 text-white font-semibold px-6 py-2 rounded-lg hover:bg-blue-700 transition-all">
                Generate Trip Plan
            </button>
        </div>
    </form>

    {% if itinerary %}
        <div class="mt-10">
            <h3 class="text-xl font-bold text-green-700 mb-4 text-center">🗺️ Your Trip Plan</h3>
            <ul class="space-y-4">
                {% for day in itinerary %}
                    <li class="bg-blue-50 border-l-4 border-blue-400 p-4 rounded">
                        <p><strong>Day {{ day.day }}:</strong> <span class="text-sm text-gray-600">{{ day.date }}</span></p>
                        <p class="italic text-gray-700 mt-1">{{ day.activities }}</p>
                    </li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}
</div>
