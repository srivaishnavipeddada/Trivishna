{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="max-w-3xl mx-auto bg-white p-8 rounded-xl shadow mt-10">
    <h2 class="text-2xl font-bold text-blue-700 mb-6">Book Package: {{ package.name }}</h2>

    <form method="post" class="space-y-6" id="booking-form" autocomplete="off">
        {% csrf_token %}

        <!-- Number of Travelers -->
        <div class="space-y-4">
            <div>
                <label for="num_travelers" class="block text-sm font-medium text-gray-700 mb-1">Number of Travelers</label>
                <input type="number" id="num_travelers" name="num_travelers" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-300 focus:outline-none"
                       min="1" value="{{ form.num_travelers.value|default_if_none:'' }}" placeholder="Enter number of travelers" required>
            </div>

            <div>
                <label for="preferred_date" class="block text-sm font-medium text-gray-700 mb-1">Preferred Travel Date</label>
                <input type="date" id="preferred_date" name="preferred_date" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-300 focus:outline-none"
                       value="{{ form.preferred_date.value|default_if_none:'' }}" required>
            </div>

            <div>
                <label for="return_date" class="block text-sm font-medium text-gray-700 mb-1">Return Date (Optional)</label>
                <input type="date" id="return_date" name="return_date" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-300 focus:outline-none"
                       value="{{ form.return_date.value|default_if_none:'' }}">
            </div>
        </div>

        <!-- Passenger Details (Dynamically Generated) -->
        <div id="passenger-fields" class="space-y-6"></div>

        <!-- Submit Button -->
        <button type="submit" class="mt-4 bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition duration-200">Book Now</button>
    </form>
</div>

<script>
    // Function to generate passenger details form dynamically based on the number of travelers
    function generatePassengerFields(numTravelers) {
        const container = document.getElementById('passenger-fields');
        container.innerHTML = '';  // Clear existing fields

        for (let i = 1; i <= numTravelers; i++) {
            const div = document.createElement('div');
            div.classList.add('border-b', 'pb-4', 'pt-4');

            div.innerHTML = `
                <h3 class="text-lg font-medium text-blue-700 mb-4">Passenger ${i} Details</h3>

                <div>
                    <label for="passenger_name_${i}" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                    <input type="text" id="passenger_name_${i}" name="passenger_name_${i}"
                           class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-300 focus:outline-none"
                           placeholder="Enter full name" required>
                </div>

                <div>
                    <label for="passenger_age_${i}" class="block text-sm font-medium text-gray-700 mb-1">Age</label>
                    <input type="number" id="passenger_age_${i}" name="passenger_age_${i}" min="0"
                           class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-300 focus:outline-none"
                           placeholder="Enter age" required>
                </div>

                <div>
                    <label for="passenger_contact_${i}" class="block text-sm font-medium text-gray-700 mb-1">Contact Number</label>
                    <input type="text" id="passenger_contact_${i}" name="passenger_contact_${i}"
                           class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-300 focus:outline-none"
                           placeholder="Enter contact number" required>
                </div>

                <div>
                    <label for="passenger_gender_${i}" class="block text-sm font-medium text-gray-700 mb-1">Gender</label>
                    <select id="passenger_gender_${i}" name="passenger_gender_${i}"
                            class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-300 focus:outline-none" required>
                        <option value="" disabled selected>Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            `;

            container.appendChild(div);  // Append generated fields
        }
    }

    // Event listener to dynamically generate passenger fields when the number of travelers changes
    document.getElementById('num_travelers').addEventListener('input', function () {
        const count = parseInt(this.value) || 0;
        generatePassengerFields(count);
    });

    // Initialize on page load if travelers are already set
    window.addEventListener('DOMContentLoaded', () => {
        const initialCount = parseInt(document.getElementById('num_travelers').value) || 0;
        generatePassengerFields(initialCount);
    });
</script>
{% endblock %}
