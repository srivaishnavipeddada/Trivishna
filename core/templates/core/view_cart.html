<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Cart</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #333;
      font-size: 2rem;
      text-align: center;
      margin-bottom: 30px;
    }

    .cart-container {
      max-width: 800px;
      margin: 0 auto;
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .cart-items {
      list-style: none;
      padding: 0;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #f4f6f9;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .cart-item .item-details {
      display: flex;
      flex-direction: column;
    }

    .cart-item .item-details h4 {
      margin: 0;
      font-size: 1.1rem;
      color: #333;
    }

    .cart-item .item-details p {
      margin: 5px 0;
      color: #777;
    }

    .cart-item .remove-btn {
      color: red;
      font-weight: bold;
      text-decoration: none;
      transition: color 0.3s;
    }

    .cart-item .remove-btn:hover {
      color: #cc0000;
    }

    .total-container {
      margin-top: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .checkout-btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: #007bff;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      text-decoration: none;
      border-radius: 6px;
      text-align: center;
      transition: background-color 0.3s;
    }

    .checkout-btn:hover {
      background-color: #0056b3;
    }

    .empty-cart-message {
      text-align: center;
      font-size: 1.2rem;
      color: #555;
    }

    .empty-cart-message a {
      color: #007bff;
      text-decoration: none;
    }

    .empty-cart-message a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="cart-container">
    <h1>Your Cart 🛒</h1>

    {% if cart %}
      <ul class="cart-items">
        {% for item in cart %}
          <li class="cart-item">
            <div class="item-details">
              <h4>{{ item.name }}</h4>
              <p>₹{{ item.price }} x {{ item.quantity }}</p>
            </div>
            <a href="{% url 'remove_from_cart' item.id %}" class="remove-btn">✖ Remove</a>
          </li>
        {% endfor %}
      </ul>

      <div class="total-container">
        <p>Total: ₹{{ total_price }}</p>
        <a href="{% url 'checkout' %}" class="checkout-btn">Proceed to Checkout</a>
      </div>
    {% else %}
      <p class="empty-cart-message">Your cart is empty! <a href="{% url 'package_list' %}">Browse Packages</a></p>
    {% endif %}
  </div>

</body>
</html>
