{% load static %}
{% block content %}

<style>
  .proof-form-container {
    max-width: 500px;
    margin: 50px auto;
    padding: 30px;
    background-color: #f9f9f9;
    border-radius: 16px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    font-family: 'Poppins', sans-serif;
  }

  .proof-form-container h2 {
    text-align: center;
    color: #004aad;
    margin-bottom: 20px;
  }

  .proof-form-container p {
    text-align: center;
    margin-bottom: 15px;
    font-size: 16px;
    color: #333;
  }

  .proof-form-container form {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .proof-form-container input,
  .proof-form-container textarea {
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }

  .proof-form-container button {
    background-color: #004aad;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  }

  .proof-form-container button:hover {
    background-color: #00338d;
  }

  /* Modal Styles */
  .modal {
    display: none;
    position: fixed;
    z-index: 1;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5); /* Black background */
    overflow: auto;
    padding-top: 60px;
  }

  .modal-content {
    background-color: #fff;
    margin: 5% auto;
    padding: 20px;
    border-radius: 8px;
    width: 80%;
    max-width: 400px;
    text-align: center;
  }

  .close {
    color: #aaa;
    font-size: 28px;
    font-weight: bold;
    position: absolute;
    top: 10px;
    right: 15px;
  }

  .close:hover,
  .close:focus {
    color: black;
    text-decoration: none;
    cursor: pointer;
  }

  .modal-button {
    background-color: #004aad;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  }

  .modal-button:hover {
    background-color: #00338d;
  }
</style>

<script>
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault(); // Disable right-click menu
  });
</script>

<div class="proof-form-container">
  <h2>Upload Payment Proof</h2>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    
    <label for="phone">Phone Number:</label>
    <input type="text" name="phone" required>

    <label>Email:</label>
    <input type="email" name="email" required>

    <label for="message">Message:</label>
    <input type="text" name="message" placeholder="e.g., Paid via GPay">

    <label for="screenshot">Upload Screenshot:</label>
    <input type="file" name="screenshot" required>

    <button type="submit">Submit</button>
  </form>
</div>

{% if submitted %}
  <div id="confirmation-modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h3>✅ Payment proof uploaded successfully!</h3>
      <p>We’ll verify and email your order details shortly.</p>
      <button class="modal-button" id="modal-ok">OK</button>
    </div>
  </div>

  <script>
    // Show the modal
    window.onload = function () {
      document.getElementById('confirmation-modal').style.display = "block";
    };

    // Close the modal when the user clicks on <span> (x)
    document.querySelector('.close').onclick = function() {
      document.getElementById('confirmation-modal').style.display = "none";
      window.location.href = "/";  // Redirect to the homepage after closing
    };

    // Close the modal and redirect when the user clicks "OK"
    document.getElementById('modal-ok').onclick = function() {
      document.getElementById('confirmation-modal').style.display = "none";
      window.location.href = "/";  // Redirect to the homepage after clicking OK
    };
  </script>
{% endif %}

{% endblock %}
