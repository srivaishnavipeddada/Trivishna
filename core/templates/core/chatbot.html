<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivishna Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* Custom Styles for Chat */
        .chat-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 300px;
            max-height: 500px;
            overflow-y: auto;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            background-color: #3498db;
            padding: 10px;
            text-align: center;
            color: white;
            font-weight: bold;
            border-radius: 10px 10px 0 0;
        }
        .chat-body {
            padding: 10px;
            flex-grow: 1;
            overflow-y: auto;
        }
        .chat-message {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 5px;
            background-color: #f1f1f1;
            max-width: 80%;
        }
        .user-message {
            background-color: #3498db;
            color: white;
            align-self: flex-end;
        }
        .assistant-message {
            background-color: #ecf0f1;
            color: #2c3e50;
        }
        .input-container {
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 0 0 10px 10px;
        }
        .input-box {
            flex-grow: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .send-button {
            padding: 10px;
            background-color: #3498db;
            color: white;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="chat-container" id="chat-container">
        <div class="chat-header">
            Trivishna Assistant
        </div>
        <div class="chat-body" id="chat-body">
            <div class="chat-message assistant-message">Hi! I'm here to help you plan your trip. 🗺️</div>
        </div>
        <div class="input-container">
            <input type="text" id="user-input" class="input-box" placeholder="Ask me anything..." />
            <button class="send-button" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const userInput = document.getElementById('user-input').value;
            if (userInput.trim() === '') return;

            const chatBody = document.getElementById('chat-body');
            const userMessageDiv = document.createElement('div');
            userMessageDiv.classList.add('chat-message', 'user-message');
            userMessageDiv.textContent = userInput;
            chatBody.appendChild(userMessageDiv);
            chatBody.scrollTop = chatBody.scrollHeight; // Scroll to bottom

            // Clear input field
            document.getElementById('user-input').value = '';

            try {
                const response = await fetch('/chatbot/api/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: userInput })
                });
                const data = await response.json();
                if (data.message) {
                    const assistantMessageDiv = document.createElement('div');
                    assistantMessageDiv.classList.add('chat-message', 'assistant-message');
                    assistantMessageDiv.textContent = data.message;
                    chatBody.appendChild(assistantMessageDiv);
                    chatBody.scrollTop = chatBody.scrollHeight; // Scroll to bottom
                } else {
                    console.error('Error: No message in response');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
